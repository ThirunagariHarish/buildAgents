name: Build iPhone app

on:
  push:
    branches: [pocketbox]
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-pocketbox
  cancel-in-progress: true

jobs:
  build:
    # Compile check for the simulator: no Apple account or signing needed.
    # Signing and TestFlight upload get added once the Apple Developer
    # account and its App Store Connect key are in the repository secrets.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pick the newest Xcode (Foundation Models needs Xcode 26)
        run: |
          X=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version

      - name: Build for the simulator
        id: build
        run: |
          set -o pipefail
          brew install xcodegen >/dev/null
          cd ios && xcodegen generate
          xcodebuild -project Pocket.xcodeproj -scheme Pocket -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ../build.log | grep -E "error:|warning: .*Pocket/|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" ../build.log

      - name: Save the build log to the branch
        if: always()
        run: |
          {
            echo "run: ${{ github.run_number }}  commit: ${GITHUB_SHA::7}  build: ${{ steps.build.outcome }}  at: $(date -u +%FT%TZ)"
            xcodebuild -version | tr '\n' ' '; echo
            echo
            grep -E "error:|warning: .*/ios/Pocket/|BUILD (SUCCEEDED|FAILED)" build.log | sort -u | head -80 || true
            echo
            echo "== last lines =="
            tail -25 build.log
          } > ios-build.log
          git config user.name "pocketbox-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch -q origin pocketbox && git checkout -q -B pocketbox origin/pocketbox
          mkdir -p deploy && mv ios-build.log deploy/ios-build.log
          git add deploy/ios-build.log
          git commit -q -m "iPhone build log for run ${{ github.run_number }} [skip ci]" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin pocketbox && git push -q origin HEAD:pocketbox && break; sleep 3; done
