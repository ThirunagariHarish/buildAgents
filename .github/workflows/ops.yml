name: Ops checks

# Read-only checks on the server, run by pushing to the ops branch. The output
# is committed back as ops-run.log. This repository is public, so the scripts
# print names, counts and yes/no answers only: emails are masked and no secret
# value is ever printed.

on:
  push:
    branches: [ops]
    paths-ignore: ['ops-run.log']

permissions:
  contents: write

concurrency:
  group: ops
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Which secrets exist (names only)
        id: names
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_SERVICE_TOKEN: ${{ secrets.DOPPLER_SERVICE_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          {
            for k in DOPPLER_TOKEN DOPPLER_SERVICE_TOKEN GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET; do
              v="${!k}"; printf '%s: %s\n' "$k" "$([ -n "$v" ] && echo set || echo missing)"
            done
            T="${DOPPLER_SERVICE_TOKEN:-$DOPPLER_TOKEN}"
            if [ -n "$T" ]; then
              echo "doppler: token type $(printf '%s' "$T" | cut -c1-6 | sed 's/_[^_]*$//')"
              curl -s -u "$T:" 'https://api.doppler.com/v3/me' | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log("doppler me: "+(j.type||"?")+" workplace="+((j.workplace&&j.workplace.name)||"?"))}catch{console.log("doppler me: unreadable")}})'
              curl -s -u "$T:" 'https://api.doppler.com/v3/projects?per_page=50' | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log("doppler projects: "+((j.projects||[]).map(p=>p.slug).join(", ")||JSON.stringify(j.messages||"none")))}catch{console.log("doppler projects: unreadable")}})'
            fi
          } | tee names.txt
          echo "report<<ENDOFREPORT" >> "$GITHUB_OUTPUT"; cat names.txt >> "$GITHUB_OUTPUT"; echo "ENDOFREPORT" >> "$GITHUB_OUTPUT"

      - name: Checks against the cluster (kubeconfig from BOX_KUBECONFIG)
        env:
          BOX_KUBECONFIG: ${{ secrets.BOX_KUBECONFIG }}
          BOX_GITHUB_TOKEN: ${{ secrets.BOX_GITHUB_TOKEN }}
        run: |
          {
            if [ -z "$BOX_KUBECONFIG" ]; then echo "BOX_KUBECONFIG: missing"; exit 0; fi
            umask 077
            if printf '%s' "$BOX_KUBECONFIG" | grep -q 'apiVersion'; then printf '%s\n' "$BOX_KUBECONFIG" > kc; else printf '%s' "$BOX_KUBECONFIG" | base64 -d > kc; fi
            echo "BOX_KUBECONFIG: set; API server port $(grep -o 'server: https://[^ ]*' kc | sed -E 's#.*:([0-9]+).*#\1#')"
            KCFG="$PWD/kc" timeout 1500 bash uw-after.sh 2>&1 | sed -E "s/x-access-token:[^@]*@/x-access-token:***@/g"
            rm -f kc
          } | tr -d '\r' > server.txt

      - name: Commit the output
        if: always()
        env:
          NAMES: ${{ steps.names.outputs.report }}
        run: |
          { echo "run ${{ github.run_number }} at $(date -u +%FT%TZ), commit ${GITHUB_SHA::7}"; echo; printf '%s\n\n' "$NAMES"; cat server.txt; } > ops-run.log
          git config user.name ops-bot; git config user.email actions@users.noreply.github.com
          git add ops-run.log; [ -f uw-openapi.json ] && git add uw-openapi.json; git commit -qm "Ops output for run ${{ github.run_number }} [skip ci]" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin ops && git push -q origin HEAD:ops && break; sleep 3; done
