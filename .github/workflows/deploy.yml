name: Deploy to VPS

on:
  push:
    branches: [box]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-box
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Which secrets GitHub is passing (lengths only)
        id: secrets
        env:
          BOX_PASSWORD: ${{ secrets.BOX_PASSWORD }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BOX_GITHUB_TOKEN: ${{ secrets.BOX_GITHUB_TOKEN }}
          BOX_KUBECONFIG: ${{ secrets.BOX_KUBECONFIG }}
          BOX_TELEGRAM_TOKEN: ${{ secrets.BOX_TELEGRAM_TOKEN }}
          BOX_TELEGRAM_CHAT_ID: ${{ secrets.BOX_TELEGRAM_CHAT_ID }}
        run: |
          {
            for k in BOX_PASSWORD CLAUDE_CODE_OAUTH_TOKEN BOX_GITHUB_TOKEN BOX_KUBECONFIG; do
              v="${!k}"; printf '%s: %s\n' "$k" "$([ -n "$v" ] && echo "set (${#v} chars)" || echo MISSING)"
            done
          } | tee secrets.txt
          echo "report<<EOF" >> "$GITHUB_OUTPUT"; cat secrets.txt >> "$GITHUB_OUTPUT"; echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Deploy to VPS via SSH
        id: ssh
        uses: appleboy/ssh-action@v1
        env:
          BOX_PASSWORD: ${{ secrets.BOX_PASSWORD }}
          BOX_DOMAIN: ${{ secrets.BOX_DOMAIN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BOX_GITHUB_TOKEN: ${{ secrets.BOX_GITHUB_TOKEN }}
          BOX_KUBECONFIG: ${{ secrets.BOX_KUBECONFIG }}
          BOX_TELEGRAM_TOKEN: ${{ secrets.BOX_TELEGRAM_TOKEN }}
          BOX_TELEGRAM_CHAT_ID: ${{ secrets.BOX_TELEGRAM_CHAT_ID }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          # Key auth when VPS_SSH_KEY is set; falls back to password otherwise
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          envs: BOX_PASSWORD,BOX_DOMAIN,CLAUDE_CODE_OAUTH_TOKEN,BOX_GITHUB_TOKEN,BOX_KUBECONFIG,BOX_TELEGRAM_TOKEN,BOX_TELEGRAM_CHAT_ID
          capture_stdout: true
          command_timeout: 25m
          script: |
            set -e
            APP_DIR=/opt/box
            REPO_URL=https://github.com/ThirunagariHarish/buildAgents.git
            BRANCH=box
            command -v git >/dev/null || (apt-get update -y && apt-get install -y git curl)
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone -b "$BRANCH" --single-branch "$REPO_URL" "$APP_DIR"
            else
              cd "$APP_DIR" && git fetch -q origin "$BRANCH" && git reset -q --hard "origin/$BRANCH"
            fi
            bash "$APP_DIR/deploy/remote-deploy.sh" 2>&1

      - name: Save server output to the branch
        if: always()
        uses: actions/checkout@v4
        with:
          ref: box

      - name: Commit deploy log
        if: always()
        env:
          OUT: ${{ steps.ssh.outputs.stdout }}
          OUTCOME: ${{ steps.ssh.outcome }}
          SECRETS: ${{ steps.secrets.outputs.report }}
        run: |
          {
            echo "run: ${{ github.run_number }}  commit: ${GITHUB_SHA::7}  ssh step: $OUTCOME  at: $(date -u +%FT%TZ)"
            echo
            echo "== secrets GitHub passed to this run =="
            printf '%s\n' "$SECRETS"
            echo
            printf '%s\n' "$OUT"
          } > deploy/last-run.log
          git config user.name "box-deploy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add deploy/last-run.log
          git commit -m "Deploy log for run ${{ github.run_number }} [skip ci]" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin box && git push -q origin HEAD:box && break; sleep 3; done
