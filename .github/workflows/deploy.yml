name: Deploy to VPS

on:
  push:
    branches: [box]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          # Key auth when VPS_SSH_KEY is set; falls back to password otherwise
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -euo pipefail
            APP_DIR="/opt/box"
            REPO_URL="https://github.com/ThirunagariHarish/buildAgents.git"
            BRANCH="box"

            command -v git >/dev/null || (apt-get update -y && apt-get install -y git curl)

            if [ ! -d "$APP_DIR/.git" ]; then
              git clone -b "$BRANCH" --single-branch "$REPO_URL" "$APP_DIR"
            else
              cd "$APP_DIR"
              git fetch origin "$BRANCH"
              git reset --hard "origin/$BRANCH"
            fi
            cd "$APP_DIR"

            # App password for Box's login prompt (HTTP Basic auth)
            if [ -n "${{ secrets.BOX_PASSWORD }}" ]; then
              printf 'BOX_PASSWORD=%s\n' '${{ secrets.BOX_PASSWORD }}' > /etc/box.env
              chmod 600 /etc/box.env
            fi

            bash deploy/setup-vps.sh
            systemctl restart box
            sleep 2

            # Health check: 200 (no password set) or 401 (auth enabled) both mean Box is up
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3400/ || true)
            echo "Health check HTTP $CODE"
            case "$CODE" in
              200|401) echo "✅ Box is up" ;;
              *) echo "❌ Box did not respond"; journalctl -u box --no-pager -n 30; exit 1 ;;
            esac

            # ---- Self-test: fetch the UI exactly as a browser would ----
            echo "===== SELF-TEST ====="
            echo "--- node ---"; node --version; echo "--- service ---"; systemctl is-active box || true
            PW=$(grep -oP '(?<=^BOX_PASSWORD=).*' /etc/box.env 2>/dev/null || echo '')
            for p in "/" "/style.css" "/app.js" "/api/agents"; do
              C=$(curl -s -o /tmp/selftest -w "%{http_code}" -u "box:$PW" --max-time 10 "http://localhost:3400$p" || echo FAIL)
              echo "GET $p -> $C ($(wc -c < /tmp/selftest 2>/dev/null || echo 0) bytes)"
            done
            echo "--- first 200B of / ---"; curl -s -u "box:$PW" --max-time 10 -o /tmp/selftest-index http://localhost:3400/ || true; head -c 200 /tmp/selftest-index || true; echo
            echo "--- recent service log ---"; journalctl -u box --no-pager -n 30 || true
            echo "--- files on disk ---"; ls -la /opt/box/public 2>/dev/null | head -12
            echo "===== END SELF-TEST ====="

            # ---- Diagnostics: what owns 80/443, so Box can be routed behind it ----
            echo "===== DIAGNOSTICS ====="
            echo "--- box service ---";      systemctl --no-pager -l status box 2>&1 | head -12 || true
            echo "--- listeners ---";        ss -ltnp 2>/dev/null | grep -E ':(80|443|3400|8080)\s' || echo "(none on 80/443/3400/8080)"
            echo "--- docker ---";           docker ps --format '{{.Names}}  {{.Image}}  {{.Ports}}' 2>/dev/null | head -15 || echo "(no docker)"
            echo "--- k3s/kube ---";         (command -v k3s >/dev/null && k3s --version | head -1) || echo "(no k3s)"; ls /etc/rancher/k3s/k3s.yaml 2>/dev/null || true
            command -v kubectl >/dev/null && kubectl get ingress -A 2>/dev/null | head -10 || true
            echo "--- traefik config ---";   ls /etc/traefik 2>/dev/null || true; docker inspect traefik --format '{{json .Config.Cmd}}' 2>/dev/null | head -c 400 || true
            echo "--- coolify/dokploy ---";  ls /data/coolify 2>/dev/null && echo coolify-present || true; ls /etc/dokploy 2>/dev/null && echo dokploy-present || true
            echo "===== END DIAGNOSTICS ====="

            # ---- Publish Box on the domain ----
            DOMAIN="${{ secrets.BOX_DOMAIN }}"
            [ -n "$DOMAIN" ] || DOMAIN="box.cashflowus.com"

            if [ -d /data/coolify/proxy ]; then
              # Coolify's Traefik owns 80/443. Publish Box through it with a
              # dynamic-config file: hot-reloaded by Traefik's file watcher,
              # auto Let's Encrypt, zero impact on Coolify-managed apps.
              mkdir -p /data/coolify/proxy/dynamic
              GW=$(docker inspect coolify-proxy --format '{{range .NetworkSettings.Networks}}{{.Gateway}} {{end}}' 2>/dev/null | awk '{print $1}')
              [ -n "$GW" ] || GW=172.17.0.1
              {
                echo 'http:'
                echo '  routers:'
                echo '    box-http:'
                echo "      rule: Host(\`$DOMAIN\`)"
                echo '      entryPoints:'
                echo '        - http'
                echo '      middlewares:'
                echo '        - box-https-redirect'
                echo '      service: box'
                echo '    box-https:'
                echo "      rule: Host(\`$DOMAIN\`)"
                echo '      entryPoints:'
                echo '        - https'
                echo '      service: box'
                echo '      tls:'
                echo '        certResolver: letsencrypt'
                echo '  middlewares:'
                echo '    box-https-redirect:'
                echo '      redirectScheme:'
                echo '        scheme: https'
                echo '  services:'
                echo '    box:'
                echo '      loadBalancer:'
                echo '        servers:'
                echo "          - url: \"http://$GW:3400\""
              } > /data/coolify/proxy/dynamic/box.yaml
              echo "Traefik route written: https://$DOMAIN -> $GW:3400"
              echo "--- route file on disk ---"; ls -la /data/coolify/proxy/dynamic/; cat /data/coolify/proxy/dynamic/box.yaml
              echo "--- traefik mounts ---"; docker inspect coolify-proxy --format '{{range .Mounts}}{{.Source}} -> {{.Destination}}{{"\n"}}{{end}}' | head -6
              echo "--- traefik file provider flags ---"; docker inspect coolify-proxy --format '{{json .Args}}' | tr ',' '\n' | grep -i 'providers.file' || echo "(NO file provider configured!)"
              sleep 8
              echo "--- traefik recent log ---"; docker logs coolify-proxy --tail 15 2>&1 | grep -iE 'error|box|filename' || echo "(no relevant traefik log lines)"
              HC=$(curl -sk -o /dev/null -w "%{http_code}" --resolve "$DOMAIN:443:127.0.0.1" "https://$DOMAIN/" || true)
              echo "HTTPS via Traefik answered: HTTP $HC (401 = Box login prompt = SUCCESS; 502 = Traefik cannot reach host; 404 = route not loaded; cert may take ~1 min on first issue)"
              exit 0
            fi

            # Fallback: Caddy on a free 80/443 (non-Coolify servers).
            MY_IP=$(curl -s --max-time 10 https://api.ipify.org || hostname -I | awk '{print $1}')
            DNS_IP=$(getent hosts "$DOMAIN" | awk '{print $1}' | head -1)
            if [ "$DNS_IP" != "$MY_IP" ]; then
              echo "⚠ $DOMAIN resolves to '$DNS_IP', not this server ($MY_IP) — skipping HTTPS setup"
            elif ss -ltn | awk '{print $4}' | grep -qE ':(80|443)$' && ! systemctl is-active --quiet caddy; then
              echo "⚠ Ports 80/443 busy with a non-Caddy service — skipping HTTPS setup, Box stays on :3400"
            else
              if ! command -v caddy >/dev/null; then
                apt-get update -y
                apt-get install -y debian-keyring debian-archive-keyring apt-transport-https curl gnupg
                curl -1sLf https://dl.cloudsmith.io/public/caddy/stable/gpg.key | gpg --yes --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
                curl -1sLf https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt > /etc/apt/sources.list.d/caddy-stable.list
                apt-get update -y && apt-get install -y caddy
              fi
              printf '%s {\n\treverse_proxy localhost:3400\n}\n' "$DOMAIN" > /etc/caddy/Caddyfile
              systemctl enable --now caddy
              systemctl reload caddy || systemctl restart caddy
              sleep 8
              HCODE=$(curl -sk -o /dev/null -w "%{http_code}" "https://$DOMAIN/" || true)
              echo "HTTPS check on $DOMAIN: HTTP $HCODE (cert may take ~1 min on first issue)"
            fi
