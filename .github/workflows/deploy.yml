name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          # Password auth for now. To switch to key auth: add a VPS_SSH_KEY
          # secret and replace the line below with:  key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -euo pipefail
            APP_DIR="/opt/box"
            REPO_URL="https://github.com/ThirunagariHarish/box.git"

            command -v git >/dev/null || (apt-get update -y && apt-get install -y git curl)

            if [ ! -d "$APP_DIR/.git" ]; then
              git clone "$REPO_URL" "$APP_DIR"
            else
              cd "$APP_DIR"
              git fetch origin main
              git reset --hard origin/main
            fi
            cd "$APP_DIR"

            # App password for Box's login prompt (HTTP Basic auth)
            if [ -n "${{ secrets.BOX_PASSWORD }}" ]; then
              printf 'BOX_PASSWORD=%s\n' '${{ secrets.BOX_PASSWORD }}' > /etc/box.env
              chmod 600 /etc/box.env
            fi

            bash deploy/setup-vps.sh
            systemctl restart box
            sleep 2

            # Health check: 200 (no password set) or 401 (auth enabled) both mean Box is up
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3400/ || true)
            echo "Health check HTTP $CODE"
            case "$CODE" in
              200|401) echo "✅ Box is up" ;;
              *) echo "❌ Box did not respond"; journalctl -u box --no-pager -n 30; exit 1 ;;
            esac
