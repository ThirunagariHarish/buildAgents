<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#151515">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Box">
<title>Box</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Sidebar: sits under the main panel on phones, beside it on desktop -->
<aside id="sidebar">
  <div class="sb-top">
    <div class="sb-brand"><span class="sb-mark" data-icon="spark"></span>Box</div>
  </div>
  <nav class="sb-nav">
    <button class="sb-link" id="nav-new"><span data-icon="chat"></span>New idea</button>
    <button class="sb-link" id="nav-agents"><span data-icon="users"></span>Agents</button>
    <button class="sb-link" id="nav-briefs"><span data-icon="stack"></span>Idea Briefs</button>
  </nav>
  <div id="idea-list" class="sb-list"></div>
  <div class="sb-bottom">
    <button class="avatar-btn" id="avatar-btn" aria-label="Settings"></button>
    <button class="pill-btn" id="sb-new"><span data-icon="plus"></span>New idea</button>
  </div>
</aside>

<!-- Main panel -->
<div id="main">
  <header id="topbar">
    <button class="circle-btn" id="menu-btn" aria-label="Open sidebar">
      <span data-icon="menu"></span><i id="menu-dot" class="hidden"></i>
    </button>
    <button class="top-title" id="top-title">
      <span id="title-text">New idea</span>
      <span id="subtitle-text"></span>
    </button>
    <button class="circle-btn" id="more-btn" aria-label="More"><span data-icon="more"></span></button>
  </header>
  <div id="stage-bar" class="hidden"></div>

  <main id="thread">
    <div id="welcome" class="hidden">
      <div class="welcome-mark" data-icon="spark"></div>
      <h1 id="greeting">Good evening</h1>
      <p class="welcome-sub">Drop in a rough idea. The room debates it, stress-tests it, and hands you a plan.</p>
      <div class="suggestions" id="suggestions"></div>
    </div>
    <div id="messages"></div>
  </main>

  <footer id="dock">
    <button id="jump-btn" class="circle-btn hidden" aria-label="Scroll to latest"><span data-icon="arrowDown"></span></button>
    <div id="state-actions"></div>
    <div id="composer">
      <div id="attach-strip" class="hidden"></div>
      <textarea id="input" rows="1" placeholder="Describe your idea…" enterkeyhint="send"></textarea>
      <div class="composer-row" id="composer-row">
        <button class="circle-btn ghost" id="plus-btn" aria-label="Add photos, files and settings"><span data-icon="plus"></span></button>
        <button class="chip-btn hidden" id="rounds-chip"></button>
        <div class="spacer"></div>
        <button class="icon-btn" id="mic-btn" aria-label="Dictate"><span data-icon="mic"></span></button>
        <button class="send-btn hidden" id="send-btn" aria-label="Send"><span data-icon="arrowUp"></span></button>
        <button class="stop-btn hidden" id="stop-btn" aria-label="Pause the debate"><span data-icon="stop"></span></button>
      </div>
      <div class="composer-row hidden" id="record-row">
        <button class="circle-btn filled" id="rec-cancel" aria-label="Cancel dictation"><span data-icon="x"></span></button>
        <canvas id="wave" height="36"></canvas>
        <button class="circle-btn filled" id="rec-stop" aria-label="Stop dictation"><span data-icon="stopSmall"></span></button>
        <button class="send-btn" id="rec-send" aria-label="Send"><span data-icon="arrowUp"></span></button>
      </div>
    </div>
  </footer>

  <div id="scrim"></div>
</div>

<input type="file" id="file-camera" accept="image/*" capture="environment" hidden>
<input type="file" id="file-photos" accept="image/*" multiple hidden>
<input type="file" id="file-any" accept="image/*,application/pdf,.pdf,.txt,.md,.markdown,.csv,.json,text/plain,text/markdown,text/csv,application/json" multiple hidden>

<div id="layer"></div>
<div id="toast" class="hidden"></div>

<script src="app.js"></script>
</body>
</html>
