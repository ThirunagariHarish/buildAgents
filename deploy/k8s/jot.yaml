# Routes jot.cashflowus.com through the cluster's Traefik to Jot,
# a systemd service on the worker node (69.62.86.166:3404), next to Box, Reinvent and
# Run Scenario. Applied by deploy/remote-deploy.sh.
apiVersion: v1
kind: Namespace
metadata:
  name: jot
---
apiVersion: v1
kind: Service
metadata:
  name: jot
  namespace: jot
spec:
  ports:
    - name: http
      port: 80
      targetPort: 3404
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: jot-host
  namespace: jot
  labels:
    kubernetes.io/service-name: jot
    endpointslice.kubernetes.io/managed-by: jot-manual
addressType: IPv4
ports:
  - name: http
    port: 3404
    protocol: TCP
endpoints:
  - addresses:
      - 69.62.86.166
    conditions:
      ready: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jot
  namespace: jot
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - host: jot.cashflowus.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jot
                port:
                  number: 80
  tls:
    - hosts:
        - jot.cashflowus.com
      secretName: jot-tls
