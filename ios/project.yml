name: Pocket
options:
  bundleIdPrefix: com.cashflowus
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Pocket:
    type: application
    platform: iOS
    sources: [Pocket]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cashflowus.pocket
        TARGETED_DEVICE_FAMILY: "1"
        POCKET_BASE_URL: https://agents.cashflowus.com
    info:
      path: Pocket/Info.plist
      properties:
        CFBundleDisplayName: Pocket
        PocketBaseURL: $(POCKET_BASE_URL)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [com.cashflowus.pocket.refresh]
        NSLocationWhenInUseUsageDescription: Agents you allowed to use your location read it only when they run.
