# Owner-run history backfill (never applied by a deploy). One streamed pass per past session over the vendor's
# daily tape file: window stats, historical prints, the selectable quotes and prior-day open interest.
# It reads the vendor token from Settings, like the worker, with the same role `app` and no owner URL.
#   sed -e "s|IMAGE_PLACEHOLDER|<image:tag in use>|" -e "s|SESSIONS_PLACEHOLDER|60|" k8s/backfill-job.yaml | kubectl apply -f -
#   kubectl -n unusual-options-detector logs -f job/history-backfill
# Rerun it any time: finished sessions are skipped. Do not start it between 09:25 and 10:20 ET on an open day.
apiVersion: batch/v1
kind: Job
metadata:
  name: history-backfill
  namespace: unusual-options-detector
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 604800
  template:
    spec:
      imagePullSecrets: [{ name: ghcr-pull }]
      restartPolicy: Never
      containers:
        - name: backfill
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          command:
            [
              'node',
              '--max-old-space-size=1536',
              'backfill.js',
              '--sessions',
              'SESSIONS_PLACEHOLDER',
            ]
          env:
            - name: APP_DB_PASSWORD
              valueFrom:
                { secretKeyRef: { name: unusual-options-detector-env, key: APP_DB_PASSWORD } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: unusual-options-detector-env, key: POSTGRES_DB } }
            - name: DATABASE_URL
              value: 'postgresql://app:$(APP_DB_PASSWORD)@unusual-options-detector-db:5432/$(POSTGRES_DB)'
            - name: BETTER_AUTH_SECRET
              valueFrom:
                { secretKeyRef: { name: unusual-options-detector-env, key: BETTER_AUTH_SECRET } }
            - name: BETTER_AUTH_URL
              value: 'https://unusual-options-detector.cashflowus.com'
            - name: SETTINGS_ENC_KEY
              valueFrom:
                { secretKeyRef: { name: unusual-options-detector-env, key: SETTINGS_ENC_KEY } }
            - name: APP_URL
              value: 'https://unusual-options-detector.cashflowus.com'
            # Required by the shared environment check; the backfill itself never uses them.
            - name: FIRST_ADMIN_EMAIL
              valueFrom:
                { secretKeyRef: { name: unusual-options-detector-env, key: FIRST_ADMIN_EMAIL } }
            - name: FIRST_ADMIN_PASSWORD
              valueFrom:
                { secretKeyRef: { name: unusual-options-detector-env, key: FIRST_ADMIN_PASSWORD } }
            - name: DATA_DIR
              valueFrom: { secretKeyRef: { name: unusual-options-detector-env, key: DATA_DIR } }
            - name: LOG_LEVEL
              valueFrom: { secretKeyRef: { name: unusual-options-detector-env, key: LOG_LEVEL } }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: '2', memory: 2Gi }
